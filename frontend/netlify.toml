# Netlify failed to auto-detect this as a Next.js project (shows up as
# "Runtime: Not set" in the site's Build settings), likely because Next.js
# 16 is newer than its detection heuristics know about - without the
# Next.js Runtime plugin explicitly enabled, Netlify just published the raw
# repo contents in a few seconds instead of actually running a Next.js
# build, so every route 404'd. This forces the plugin on regardless of
# auto-detection.
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"
