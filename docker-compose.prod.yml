# PRODUCTION compose file - this is what actually runs on the Oracle Cloud
# VM (92.5.160.231, /home/ubuntu/bip). It was hand-edited directly on the
# server over time and had drifted out of version control; this copy was
# pulled back from the server so infra changes go through git like
# everything else. If you edit this file, deploy it with:
#
#   scp docker-compose.prod.yml ubuntu@92.5.160.231:/home/ubuntu/bip/docker-compose.yml
#   ssh ubuntu@92.5.160.231 "cd /home/ubuntu/bip && sudo docker compose up -d"
#
# Differences from docker-compose.yml (dev): no --reload, no source
# bind-mounts, per-service memory limits, Caddy terminates TLS instead of
# exposing backend/db/redis ports directly on the host. There's no frontend
# or celery_worker container here - the frontend is deployed separately on
# Netlify (see netlify.toml) and Celery has no active workload in
# production yet (see backend/app/workers/celery_app.py).
services:
  db:
    image: postgres:15-alpine
    container_name: bip_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 150m

  redis:
    image: redis:7-alpine
    container_name: bip_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 50m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bip_backend
    restart: always
    # --forwarded-allow-ips: uvicorn's ProxyHeadersMiddleware is on by
    # default but only trusts X-Forwarded-For from 127.0.0.1, and Caddy is
    # a SEPARATE container reaching us over the Docker bridge (172.x.x.x).
    # So the header was ignored and request.client.host was Caddy's own IP
    # on every request - meaning slowapi saw one single client for the
    # entire userbase and rate-limited everyone against one shared bucket
    # (see app/core/limiter.py). "*" is safe specifically here because this
    # service publishes NO host ports: Caddy is the only possible ingress,
    # so nothing untrusted can reach uvicorn to spoof the header.
    # Liste (exec) formu bilerek: string formu shlex ile bölünüyor ve
    # tırnakların nasıl sıyrıldığı gözle görülmüyor - "*" yanlışlıkla
    # tırnaklarıyla birlikte geçerse trusted_hosts hiçbir şeyle eşleşmez ve
    # düzeltme sessizce çalışmamış olurdu. Liste formunda kabuk hiç devrede
    # değil, uvicorn argümanı birebir alıyor.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips", "*"]
    env_file:
      - .env
    volumes:
      # A real TradingView auth_token, refreshed by deploy/refresh_tv_auth_token.sh
      # via cron (see that script's docstring) - read-only, this container
      # never writes to it. Must already exist as a file on the host before
      # `docker compose up` (an empty `touch` is enough) or Docker will
      # create it as a directory instead.
      - ./tv_auth_token.txt:/app/tv_auth_token.txt:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 400m

  caddy:
    image: caddy:2-alpine
    container_name: bip_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Desktop app installer download (see Caddyfile's /download/* route) -
      # a static file directory, not something the backend serves. Kept
      # read-only since the exe is only ever written here from this host's
      # own deploy step, never from inside the container.
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    mem_limit: 60m

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
