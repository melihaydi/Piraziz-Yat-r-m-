name: Server Diagnostics

# Salt-okunur teşhis - hiçbir şey build/deploy etmez, sunucuyu yeniden
# başlatmaz. "Sunucu yavaş" şikayetlerinde ne olduğunu görmek için var:
# uptime/RAM/disk/docker stats + backend'in son loglarını job log'una yazar.
# Aynı DEPLOY_SSH_KEY secret'ını kullanıyor (ci.yml'deki deploy job'ıyla
# aynı sunucu, aynı salt-okunur amaç).
on:
  workflow_dispatch:

jobs:
  tefas-runner-probe:
    # GECİCİ: TEFAS prod sunucumuzun IP'sini (92.5.160.231) sessizce
    # engellediği kanıtlandı (TLS handshake tam başarılı, HTTP isteği tam
    # gönderiliyor, TEFAS "Empty reply from server" ile bağlantıyı kesiyor).
    # Bu, GitHub'ın kendi runner'ının (Azure barındırmalı, farklı IP/ASN)
    # aynı engele takılıp takılmadığını görmek için - eğer TEFAS'a
    # buradan ulaşılabiliyorsa, periyodik bir GitHub Actions cron job'ı
    # veriyi buradan çekip backend'e aktarabilir (relay), sunucu IP'si
    # değişmeden. Sonuç netleşince bu job kaldırılacak.
    runs-on: ubuntu-latest
    steps:
      - name: TEFAS'a GitHub runner üzerinden erişim testi
        run: |
          echo "=== outbound IP (GitHub runner) ===" && curl -sS --max-time 10 https://api.ipify.org
          echo ""
          echo "=== TEFAS reachability from GitHub runner ===" && curl -v -sS --max-time 15 -X POST "https://www.tefas.gov.tr/api/funds/fonGnlBlgSiraliGetir" -H "Content-Type: application/json" -H "Origin: https://www.tefas.gov.tr" -H "Referer: https://www.tefas.gov.tr/tr/fon-verileri" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36" -d '{"fontip":"YAT","bastarih":"24.08.2026","bittarih":"24.08.2026"}' 2>&1 | tail -80

  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: SSH diagnostics
        env:
          SERVER_HOST: 92.5.160.231
          SERVER_USER: ubuntu
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" '
            echo "=== uptime / load ===" && uptime
            echo "=== memory ===" && free -h
            echo "=== swap activity ===" && vmstat 1 3
            echo "=== disk ===" && df -h /
            echo "=== docker ps ===" && sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=== docker stats (snapshot) ===" && sudo docker stats --no-stream
            echo "=== backend logs (last 200 lines) ===" && cd /home/ubuntu/bip && sudo docker compose logs --tail=200 backend
            echo "=== backend health from inside server ===" && curl -sS -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}s\n" https://api.bipterminal.com/health
          '
