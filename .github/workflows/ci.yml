name: BIP Monorepo CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # Deploy is manual-trigger only (Actions tab -> this workflow -> Run
  # workflow), never automatic on push - a bad push auto-deploying straight
  # to a live financial app's prod server is too risky for a solo-maintained
  # project. Triggering this way still runs every job below (tests/build/
  # docker-verify) first; `deploy` only executes once those are green (see
  # its `needs:` + `if:` at the bottom of this file).
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # matches backend/Dockerfile's python:3.11-slim base image

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend pytest
        env:
          SECRET_KEY: test_secret_key_placeholder
          DATABASE_URL: sqlite:///./test.db  # Use sqlite for simple isolated CI testing if PostgreSQL is not active in service container
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ""
        run: |
          cd backend
          python -m pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js build
        run: |
          cd frontend
          npm run build

  android-build:
    # Builds the Capacitor Android wrapper (frontend/android) so it can't
    # silently drift out of sync with the web app - previously this was
    # only ever built by hand on someone's machine, with no CI signal if a
    # dependency bump or capacitor.config.ts change broke it. This produces
    # a debug-signed APK (installable for sideloading/testing) as a build
    # artifact on every push; there's no release keystore configured yet,
    # so it doesn't attempt a signed release build - see the comment above
    # the gradle step for how to add that once one exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x requires Node >=22 (confirmed live: `npx cap
          # sync` fails outright on Node 20 with "[fatal] The Capacitor CLI
          # requires NodeJS >=22.0.0") - deliberately newer than the plain
          # frontend-build job's Node 20, which only needs to satisfy Next.js.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # @capacitor/android's own build.gradle pins sourceCompatibility/
          # targetCompatibility to VERSION_21 (confirmed live: JDK 17 failed
          # compileDebugJavaWithJavac with "error: invalid source release: 21") -
          # this must match regardless of what AGP itself would tolerate.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: |
          cd frontend
          npx cap sync android

      # capacitor.config.ts points webDir at the live Netlify deployment
      # (server.url mode - see that file's comment) rather than a locally
      # bundled build, so this doesn't need `npm run build` first: the APK
      # is just a native shell that loads the already-deployed site.
      #
      # To add signed release builds later: create a keystore, base64-encode
      # it into a KEYSTORE_BASE64 repo secret alongside KEYSTORE_PASSWORD/
      # KEY_ALIAS/KEY_PASSWORD, decode it to a file in a step here, and swap
      # `assembleDebug` below for `assembleRelease` with those properties
      # passed via -P flags (or a signingConfig in app/build.gradle reading
      # them from env vars).
      - name: Build debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: piraziz-yatirim-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  docker-build-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false

  deploy:
    # Manual-trigger only (see workflow_dispatch above) and gated on the
    # real test/build jobs actually passing - `needs` fails this job
    # outright if any of them failed, and `if` skips it entirely on a
    # normal push/PR run (this only runs when someone explicitly clicks
    # "Run workflow").
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, docker-build-verification]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to production
        env:
          SERVER_HOST: 92.5.160.231
          SERVER_USER: ubuntu
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The server's /home/ubuntu/bip is NOT a git clone (deliberately -
          # see docker-compose.prod.yml's own comment) - rsync mirrors just
          # the backend/ subtree instead, excluding everything that's
          # server-local state rather than versioned source (.env,
          # tv_auth_token.txt, the sqlite fallback db, __pycache__, the venv
          # a fresh install would create, and the test suite - no reason to
          # ship tests to a prod box).
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='tv_auth_token.txt' \
            --exclude='*.db' \
            --exclude='*.sqlite' \
            --exclude='__pycache__' \
            --exclude='**/__pycache__' \
            --exclude='venv' \
            --exclude='tests' \
            --exclude='tefas_cache.json' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/ "$SERVER_USER@$SERVER_HOST:/home/ubuntu/bip/backend/"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" '
            cd /home/ubuntu/bip &&
            sudo docker compose build backend &&
            sudo docker compose up -d backend &&
            sleep 8 &&
            sudo docker compose exec -T backend alembic upgrade head
          '

      - name: Verify deployment health
        run: |
          # Through Caddy's public HTTPS endpoint, not a direct container
          # port - backend:8000 isn't published on the host (Caddy reaches
          # it over the internal docker network only), and this also proves
          # the full real path (backend + Caddy + TLS) actually works, not
          # just the container in isolation.
          curl -sf https://92-5-160-231.sslip.io/health || (echo "Health check failed after deploy" && exit 1)
