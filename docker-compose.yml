# LOCAL DEV ONLY - hot-reloading, bind-mounted source, ports exposed
# directly on the host. Production runs docker-compose.prod.yml (no
# --reload, standalone frontend build, Caddy reverse proxy, no source
# bind-mounts) - see deployment_guide.md. Never point a `docker compose
# -f docker-compose.yml` invocation at a production host.
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bip_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bip_password}
      POSTGRES_DB: ${POSTGRES_DB:-bip_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bip_user} -d ${POSTGRES_DB:-bip_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bip_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bip_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bip_celery_worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bip_frontend
    restart: always
    # Overrides the Dockerfile's production CMD (node server.js against the
    # built standalone output) with the dev server against the bind-mounted
    # source below, matching every other service in this dev-only file.
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
